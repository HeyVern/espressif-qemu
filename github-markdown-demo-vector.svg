<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 0 480 140">
  <style>
    .ring { fill: none; stroke: #58a6ff; stroke-width: 3; transform-origin: 70px 70px; animation: pulse 2s ease-out infinite; }
    .ring.b { animation-delay: .7s; }
    .ring.c { animation-delay: 1.4s; }
    @keyframes pulse { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    .bar { fill: #2da44e; animation: grow 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    @media (prefers-color-scheme: dark) { .label { fill: #e6edf3; } }
    .label { fill: #1f2328; font: 600 18px sans-serif; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#8250df"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
  </defs>
  <circle class="ring" cx="70" cy="70" r="40"/>
  <circle class="ring b" cx="70" cy="70" r="40"/>
  <circle class="ring c" cx="70" cy="70" r="40"/>
  <circle cx="70" cy="70" r="8" fill="#58a6ff"/>
  <rect class="bar" x="180" y="40" width="18" height="70" rx="3"/>
  <rect class="bar" x="206" y="40" width="18" height="70" rx="3" style="animation-delay:.3s"/>
  <rect class="bar" x="232" y="40" width="18" height="70" rx="3" style="animation-delay:.6s"/>
  <rect x="290" y="45" width="170" height="50" rx="25" fill="url(#g)"/>
  <text x="375" y="76" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16">gradient pill</text>
  <text class="label" x="180" y="132">animated SVG, theme-aware</text>
</svg>
