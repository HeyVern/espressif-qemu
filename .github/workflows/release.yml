name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the publish step creates a release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named for the MCU, not a board: board wiring is set at run time with
          # -global (see boards/*.json), so one artifact serves every board on
          # this architecture.
          - mcu: esp32s3
            target: xtensa-softmmu
            binary: qemu-system-xtensa
          - mcu: esp32c3
            target: riscv32-softmmu
            binary: qemu-system-riscv32
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson libglib2.0-dev libpixman-1-dev \
            libgcrypt20-dev python3-venv flex bison zstd

      - name: Bootstrap patched tree
        run: scripts/bootstrap.sh

      - name: Build ${{ matrix.target }}
        run: scripts/build.sh ${{ matrix.target }}

      # pc-bios ships the ROMs the machines load at run time, so it travels with
      # the binary rather than being fetched separately.
      - name: Package
        run: |
          src=build/qemu-esp
          out=${{ matrix.mcu }}-${GITHUB_REF_NAME:-dev}-linux-x86_64
          mkdir -p "$out"
          cp "$src/build/${{ matrix.binary }}" "$out/"
          cp -r "$src/pc-bios" "$out/"
          cp qemu.lock "$out/"
          tar -caf "$out.tar.zst" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mcu }}
          path: '*.tar.zst'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: espressif-qemu ${{ github.ref_name }}
          body: |
            QEMU ${{ github.ref_name }} (espressif/qemu esp-develop-9.2.2-20260417)
            with the LoRa device models and fixes applied.

            One asset per MCU. Board wiring (radio chip-select pin, SPI
            controller) is set at run time with -global; boards/*.json in this
            repo carries the arguments for each board.
          files: '*.tar.zst'
