name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the publish step creates a release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The models still carry board-specific constants (radio CS GPIO, SPI
          # controller), so an artifact is named for the board it was tuned for,
          # not just the MCU. Add an entry per board until those become qdev
          # properties, at which point one MCU artifact covers all of them.
          - board: heltec_v4_esp32s3
            target: xtensa-softmmu
            binary: qemu-system-xtensa
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson libglib2.0-dev libpixman-1-dev \
            libgcrypt20-dev python3-venv flex bison zstd

      - name: Bootstrap patched tree
        run: scripts/bootstrap.sh

      - name: Build ${{ matrix.target }}
        run: scripts/build.sh ${{ matrix.target }}

      # pc-bios ships the ROMs the machines load at run time, so it travels with
      # the binary rather than being fetched separately.
      - name: Package
        run: |
          src=build/qemu-esp
          out=${{ matrix.board }}-${GITHUB_REF_NAME:-dev}-linux-x86_64
          mkdir -p "$out"
          cp "$src/build/${{ matrix.binary }}" "$out/"
          cp -r "$src/pc-bios" "$out/"
          cp qemu.lock "$out/"
          tar -caf "$out.tar.zst" "$out"
          sha256sum "$out.tar.zst" > "$out.tar.zst.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: '*.tar.zst*'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: espressif-qemu ${{ github.ref_name }}
          body: |
            QEMU ${{ github.ref_name }} (espressif/qemu esp-develop-9.2.2-20260417)
            with the MobMesh device models and fixes applied.

            Assets are named for the board they were built for: the radio models
            still carry compile-time GPIO and SPI constants.
          files: |
            *.tar.zst
            *.tar.zst.sha256
